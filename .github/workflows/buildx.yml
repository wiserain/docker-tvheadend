name: buildx

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
  pull_request:
  schedule:
    - cron: "0 21 * * 5"

env:
  DOCKERHUB_USER: wiserain
  IMAGE_NAME: wiserain/tvheadend

defaults:
  run:
    shell: bash

jobs:
  buildx:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    if: github.actor == github.event.repository.owner.login
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to docker.io
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Resolve upstream versions
        id: upstream
        run: |
          set -euo pipefail

          TVHEADEND_COMMIT=$(git ls-remote https://github.com/tvheadend/tvheadend.git refs/heads/master | awk 'NR == 1 { print $1 }')
          EPG2XML_VER=$(curl -fsSL https://api.github.com/repos/epg2xml/epg2xml/releases/latest | jq -er '.tag_name')

          test -n "$TVHEADEND_COMMIT"
          test -n "$EPG2XML_VER"

          echo "tvheadend_commit=$TVHEADEND_COMMIT" >> "$GITHUB_OUTPUT"
          echo "epg2xml_ver=$EPG2XML_VER" >> "$GITHUB_OUTPUT"
      -
        name: Build and Push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: |
            ${{ env.IMAGE_NAME }}:ci
            ghcr.io/${{ env.IMAGE_NAME }}:ci
          build-args: |
            TVHEADEND_COMMIT=${{ steps.upstream.outputs.tvheadend_commit }}
            EPG2XML_VER=${{ steps.upstream.outputs.epg2xml_ver }}
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          no-cache: ${{ github.event_name == 'schedule' }}
      -
        name: Verify Image
        id: verify
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          test -n "$IMAGE_DIGEST"

          CID=$(docker run -d "ghcr.io/${{ env.IMAGE_NAME }}@$IMAGE_DIGEST")
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          BUILD=$(docker exec "$CID" tvheadend -v | awk -F'[_ ]' '{print $NF}' | awk -F'[_~]' '{print $1}')

          test -n "$BUILD"
          echo "tvh_build=$BUILD" >> "$GITHUB_OUTPUT"
      -
        name: Promote Tags
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --tag "${{ env.IMAGE_NAME }}:latest" \
            --tag "${{ env.IMAGE_NAME }}:${{ steps.verify.outputs.tvh_build }}" \
            "${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

          docker buildx imagetools create \
            --tag "ghcr.io/${{ env.IMAGE_NAME }}:latest" \
            --tag "ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.verify.outputs.tvh_build }}" \
            "ghcr.io/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
      -
        name: Send Notification
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          description: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.verify.outputs.tvh_build }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.verify.outputs.tvh_build }}
